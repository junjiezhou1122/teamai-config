# Roles manifest
# Define team roles and their resource access

roles:
  - id: frontend
    description: Frontend development skills
    skills:
      - "skills/*"
    rules:
      - "rules/*"
    docs:
      - "docs/*"

  - id: backend
    description: Backend development skills
    skills:
      - "skills/*"
    rules:
      - "rules/*"
    docs:
      - "docs/*"

  - id: all
    description: All skills and resources
    skills:
      - "skills/*"
    rules:
      - "rules/*"
    docs:
      - "docs/*"
